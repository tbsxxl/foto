<style>
/* Layout: Werkbank – oben die Bühne mit dem durchgehenden Karussell-Streifen, darunter (Desktop: rechts) das Werkzeug-Dock wie in einer Foto-App */
:root{
  --bg:#121418; --stage:#0b0c0f; --surface:#191c21; --surface-2:#23272e; --line:#2f343d;
  --fg:#ecebe6; --muted:#8f949e; --accent:#f2c14e; --accent-ink:#1d1704; --danger:#ef6b5b;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.mark{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap}
.mark i{font-style:normal;color:var(--accent)}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn svg{width:20px;height:20px}
.btn{height:36px;padding:0 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.small{height:32px;padding:0 12px;font-size:13px}
@media (max-width:420px){ .top .btn .lbl-long{display:none} .tag{display:none} }

.workspace{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:160px;position:relative;background:var(--stage);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage-hint{position:absolute;left:16px;right:16px;bottom:8px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}

.dock{background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;height:clamp(250px,46%,430px)}
.panel-head{display:flex;align-items:center;gap:6px;padding:10px 16px 0;min-height:44px;flex-wrap:wrap}
.panel-head .title{font-family:var(--display);font-weight:600;font-size:15px;margin-right:auto}
.panel-head .hint{color:var(--muted);font-size:13px;margin-right:auto}
.panel{overflow-y:auto;padding:10px 16px 16px;min-height:0;flex:1;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;overflow-x:auto;gap:2px;padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);scrollbar-width:none;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 12px 8px;font-size:13px;font-weight:500;color:var(--muted);position:relative;border-radius:8px;display:inline-flex;align-items:center}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:50%;top:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.tab.add{color:var(--fg)}
.tab.add b{color:var(--accent);font-weight:700;margin-right:3px}

@media (min-width:900px){
  .workspace{flex-direction:row}
  .dock{height:auto;width:380px;border-top:0;border-left:1px solid var(--line)}
}

.sec-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.group{display:flex;flex-direction:column;gap:8px}
.sl{display:flex;flex-direction:column;gap:0}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.sl-top label{color:var(--fg)}
.sl-top output{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sl.changed .sl-top output{color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--line) var(--a,0%),var(--accent) var(--a,0%),var(--accent) var(--b,0%),var(--line) var(--b,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--fg);margin-top:-9px;border:0;box-shadow:0 1px 4px rgba(0,0,0,.55)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--line) var(--a,0%),var(--accent) var(--a,0%),var(--accent) var(--b,0%),var(--line) var(--b,0%))}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--fg);border:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:4px}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1}

.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface) inset}
.color-in{width:34px;height:34px;padding:0;border:2px solid var(--line);border-radius:50%;background:var(--surface-2);overflow:hidden}
.color-in::-webkit-color-swatch-wrapper{padding:0}
.color-in::-webkit-color-swatch{border:0;border-radius:50%}

.looks{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
.looks::-webkit-scrollbar{display:none}
.look{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.look canvas{width:70px;height:70px;border-radius:10px;background:var(--surface-2);object-fit:cover;outline:2px solid transparent;outline-offset:2px}
.look[aria-pressed="true"]{color:var(--fg)}
.look[aria-pressed="true"] canvas{outline-color:var(--accent)}

.stepper{display:flex;align-items:center;gap:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:40px;height:36px;font-size:18px}
.stepper span{min-width:64px;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent-ink)}

.hist{width:100%;height:64px;display:block;border-radius:8px;background:var(--stage)}
.curve-wrap{position:relative}
.curve{width:100%;height:200px;display:block;border-radius:10px;background:var(--stage);touch-action:none}
.bands{display:flex;gap:10px;flex-wrap:wrap}
.band{width:28px;height:28px;border-radius:50%;background:var(--c);border:2px solid transparent;position:relative}
.band[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.band.mod::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}

textarea.txt{width:100%;min-height:72px;resize:vertical;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;-webkit-user-select:text;user-select:text}
input.name{flex:1;min-width:0;height:36px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;-webkit-user-select:text;user-select:text}
.fontchip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);flex:0 0 auto;min-width:76px}
.fontchip .aa{font-size:22px;line-height:1.1}
.fontchip span{font-size:11px;color:var(--muted)}
.fontchip[aria-pressed="true"]{border-color:var(--accent)}

.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:left}
.tpl svg{width:100%;height:auto;display:block}
.tpl b{font-size:13px;font-weight:600}
.tpl span{font-size:12px;color:var(--muted);line-height:1.35}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.note b{color:var(--fg);font-weight:600}
.callout{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em}
.sheet-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ig{width:min(100%,440px);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ig-head{display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:600;font-size:13px}
.ig-ava{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 200deg,var(--accent),var(--danger),var(--accent))}
.ig-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pan-y}
.ig-track::-webkit-scrollbar{display:none}
.ig-track canvas{flex:0 0 100%;width:100%;scroll-snap-align:start;display:block}
.ig-dots{display:flex;justify-content:center;gap:5px;padding:10px}
.ig-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.ig-dots i.on{background:var(--accent)}
.ig-count{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px;font-family:var(--mono)}
.ig-frame{position:relative}
.exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:min(100%,760px)}
.exp-item{display:flex;flex-direction:column;gap:6px}
.exp-item img{width:100%;border-radius:8px;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;background:var(--surface-2)}
.exp-item .row{justify-content:space-between}
.exp-item .num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.progress{font-family:var(--mono);color:var(--muted);font-size:13px}
.exp-note{width:min(100%,760px)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){ .switch::after{transition:none} }
</style>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;

    case 'applyAll': state.layers.filter(x => x.type === 'image' && x !== l).forEach(x => x.params = clone(l.params)); commit(); toast('Auf alle Fotos übertragen'); return;
    case 'savePreset': { const name = ($('#presetName').value || '').trim() || `Preset ${loadPresets().length + 1}`; const ps = loadPresets(); ps.push({ name, params: clone(l.params) }); savePresets(ps); renderPanel(); toast(`„${name}“ gesichert`); return; }
    case 'clearPresets': if (!ui.confirmPresets) { ui.confirmPresets = true; renderPanel(); return; } ui.confirmPresets = false; savePresets([]); renderPanel(); toast('Presets gelöscht'); return;
  }
}
function loadPresets() { try { return JSON.parse(localStorage.getItem('streifzug.presets') || '[]'); } catch { return []; } }
function savePresets(p) { try { localStorage.setItem('streifzug.presets', JSON.stringify(p)); } catch { toast('Presets können in diesem Browser nicht gespeichert werden.'); } }

function markBands() { const l = selLayer(); panel.querySelectorAll('.band').forEach((b, i) => b.classList.toggle('mod', l.params.hsl[i].some(v => v))); }

/* Look-Vorschaubilder */
function fillThumbs() {
  const l = selLayer(); if (!l) return; const c = ensureCache(l); if (!c) return;
  if (!c.thumbAux) { const o = c.orient, s = 140 / Math.min(o.width, o.height), t = document.createElement('canvas'); t.width = Math.max(1, Math.round(o.width * s)); t.height = Math.max(1, Math.round(o.height * s)); t.getContext('2d').drawImage(o, 0, 0, t.width, t.height); c.thumbAux = makeAux(t); c.thumbs = {}; }
  const base = { ...l.params, stamp: false }, keyBase = JSON.stringify({ ...base, look: '', lookAmt: 100 });
  panel.querySelectorAll('canvas[data-thumb]').forEach(cnv => {
    const k = cnv.dataset.thumb, key = keyBase + k;
    if (!c.thumbs[k] || c.thumbs[k].key !== key) c.thumbs[k] = { key, img: processImage(c.thumbAux, { ...base, look: k, lookAmt: 100 }, '') };
    const im = c.thumbs[k].img, x = cnv.getContext('2d'), s = Math.min(im.width, im.height);

}
/* Histogramm */
function drawHist() {
  const cnv = $('#hist'), l = selLayer(); if (!cnv || !l) return; const c = cache.get(l.id); if (!c || !c.proc) return;
  const dpr = Math.min(3, devicePixelRatio || 1), W = cnv.clientWidth * dpr, H = cnv.clientHeight * dpr; cnv.width = W; cnv.height = H;
  const src = c.proc, s = Math.min(1, 300 / Math.max(src.width, src.height)), t = document.createElement('canvas'); t.width = Math.max(1, src.width * s | 0); t.height = Math.max(1, src.height * s | 0);
  t.getContext('2d').drawImage(src, 0, 0, t.width, t.height); const d = t.getContext('2d').getImageData(0, 0, t.width, t.height).data;
  const hr = new Float32Array(64), hg = new Float32Array(64), hb = new Float32Array(64);
  for (let i = 0; i < d.length; i += 4) { hr[d[i] >> 2]++; hg[d[i + 1] >> 2]++; hb[d[i + 2] >> 2]++; }
  const mx = Math.max(...hr.slice(1, 63), ...hg.slice(1, 63), ...hb.slice(1, 63)) || 1, x = cnv.getContext('2d');
  x.globalCompositeOperation = 'lighter';
  [[hr, 'rgba(229,72,77,.55)'], [hg, 'rgba(79,178,107,.55)'], [hb, 'rgba(63,127,224,.6)']].forEach(([a, col]) => {
    x.fillStyle = col; x.beginPath(); x.moveTo(0, H);

    x.lineTo(W, H); x.closePath(); x.fill();
  });
}
/* Gradationskurve */
function setupCurve() {
  const cnv = $('#curve'); if (!cnv) return; const l = selLayer();
  const draw = () => {
    const dpr = Math.min(3, devicePixelRatio || 1), W = cnv.clientWidth * dpr, H = cnv.clientHeight * dpr; cnv.width = W; cnv.height = H;
    const x = cnv.getContext('2d'), pad = 14 * dpr, iw = W - 2 * pad, ih = H - 2 * pad, ys = l.params.curves[ui.curveCh];
    const col = { rgb: COL.fg, r: '#e5484d', g: '#4fb26b', b: '#3f7fe0' }[ui.curveCh];
    x.strokeStyle = 'rgba(255,255,255,.08)'; x.lineWidth = 1 * dpr;
    for (let i = 0; i <= 4; i++) { x.beginPath(); x.moveTo(pad + iw * i / 4, pad); x.lineTo(pad + iw * i / 4, pad + ih); x.stroke(); x.beginPath(); x.moveTo(pad, pad + ih * i / 4); x.lineTo(pad + iw, pad + ih * i / 4); x.stroke(); }
    x.strokeStyle = 'rgba(255,255,255,.18)'; x.setLineDash([4 * dpr, 4 * dpr]); x.beginPath(); x.moveTo(pad, pad + ih); x.lineTo(pad + iw, pad); x.stroke(); x.setLineDash([]);
    const f = curveFn(ys); x.strokeStyle = col; x.lineWidth = 2 * dpr; x.beginPath();
    for (let i = 0; i <= 100; i++) { const v = i / 100; const yy = clamp(f(v)); i ? x.lineTo(pad + v * iw, pad + (1 - yy) * ih) : x.moveTo(pad + v * iw, pad + (1 - yy) * ih); } x.stroke();
    ys.forEach((v, i) => { x.fillStyle = col; x.beginPath(); x.arc(pad + i / 4 * iw, pad + (1 - v) * ih, 7 * dpr, 0, Math.PI * 2); x.fill(); x.strokeStyle = COL.stage; x.lineWidth = 2 * dpr; x.stroke(); });
  };
  draw();
  let idx = -1;
  const pos = e => { const r = cnv.getBoundingClientRect(), pad = 14; return { x: clamp((e.clientX - r.left - pad) / (r.width - 2 * pad)), y: clamp(1 - (e.clientY - r.top - pad) / (r.height - 2 * pad)) }; };
  cnv.onpointerdown = e => { cnv.setPointerCapture(e.pointerId); const p = pos(e); idx = Math.round(p.x * 4); l.params.curves[ui.curveCh][idx] = +p.y.toFixed(3); draw(); requestRender(); };
  cnv.onpointermove = e => { if (idx < 0) return; const p = pos(e); l.params.curves[ui.curveCh][idx] = +p.y.toFixed(3); draw(); requestRender(); };
  cnv.onpointerup = cnv.onpointercancel = () => { if (idx >= 0) { idx = -1; pushHistory(); } };
}

/* ---------- Vorlagen ---------- */
function applyTemplate(kind) {
  const { W, H } = dims(), n = state.slides, T = W * n;
  let imgs = state.layers.filter(l => l.type === 'image'); const texts = state.layers.filter(l => l.type === 'text');
  if (!imgs.length) { toast('Füge zuerst ein Foto hinzu.'); return; }
  const need = kind === 'pano' ? imgs.length : kind === 'seam' ? Math.max(1, n - 1) : kind === 'polaroid' ? n * 2 : n;
  const pool = imgs.slice(); while (pool.length < need) { const c = clone(imgs[pool.length % imgs.length]); c.id = nid++; pool.push(c); }
  const use = pool.slice(0, Math.max(need, kind === 'pano' ? 1 : 0));
  const reset = l => { l.rot = 0; l.shape = 'rect'; l.border = 0; l.shadow = false; l.opacity = 1; };
  if (kind === 'pano') {
    const [first, ...rest] = use; reset(first); first.crop.ratio = 'orig'; coverAll(first);
    rest.forEach((l, i) => { reset(l); l.crop.ratio = .8; l.shape = 'polaroid'; l.border = Math.round(W * .03); l.borderColor = '#ffffff'; l.shadow = true; l.w = W * .5; const s = 1 + i % Math.max(1, n - 1); l.x = Math.min(T - W * .5, s * W + W * .1); l.y = H * .52; l.rot = i % 2 ? 4 : -4; });
  } else if (kind === 'single' || kind === 'frame') {
    use.forEach((l, i) => { reset(l); if (kind === 'single') { l.crop.ratio = W / H; l.w = W; l.x = (i + .5) * W; l.y = H / 2; } else { l.crop.ratio = .8; l.w = W * .82; l.x = (i + .5) * W; l.y = H / 2; } });
    if (kind === 'frame') { state.bg.c1 = '#ffffff'; state.bg.grad = false; }
  } else if (kind === 'seam') {
    use.forEach((l, i) => { reset(l); l.crop.ratio = .8; l.w = W * .9; l.x = n === 1 ? W / 2 : (i + 1) * W; l.y = H / 2; l.shadow = true; l.rot = i % 2 ? 3 : -3; });
  } else if (kind === 'polaroid') {
    use.forEach((l, i) => { reset(l); l.crop.ratio = 1; l.shape = 'polaroid'; l.border = Math.round(W * .028); l.borderColor = '#ffffff'; l.shadow = true; l.w = W * .5;
      const slot = (i + .5) * T / use.length; l.x = slot; l.y = H * (i % 2 ? .62 : .38); l.rot = [-8, 5, -3, 7, -6, 4][i % 6]; });
  }
  state.layers = [...use, ...texts]; ui.sel = null; commit(); toast('Vorlage angewendet');
}

/* ---------- Vorschau ---------- */
function openPreview() {
  ui.sel = null; renderUI();
  const { W, H } = dims(), track = $('#igTrack'), dots = $('#igDots'); track.innerHTML = ''; dots.innerHTML = '';
  const dpr = Math.min(3, devicePixelRatio || 1), cw = Math.round(Math.min(440, innerWidth - 32) * dpr), chh = Math.round(cw * H / W);
  $('#previewSheet').hidden = false;
  for (let i = 0; i < state.slides; i++) {
    const c = document.createElement('canvas'); c.width = cw; c.height = chh; const x = c.getContext('2d');
    x.scale(cw / W, cw / W); x.translate(-i * W, 0); drawScene(x); track.appendChild(c);
    dots.insertAdjacentHTML('beforeend', `<i class="${i ? '' : 'on'}"></i>`);

}
$('#igTrack').addEventListener('scroll', e => { const t = e.target, i = Math.round(t.scrollLeft / t.clientWidth); $('#igCount').textContent = `${i + 1}/${state.slides}`; [...$('#igDots').children].forEach((d, k) => d.classList.toggle('on', k === i)); }, { passive: true });

/* ---------- Export ---------- */
let dlPromise = null;
// Außerhalb von claude.ai: Teilen-Menü (Handy) oder normaler Download (Desktop)
const webDL = { async save({ filename, data }) {
  const file = new File([data], filename, { type: data.type || 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia('(pointer:coarse)').matches) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e && e.name === 'AbortError') throw { code: 'declined' }; }
  }
  const a = document.createElement('a'), url = URL.createObjectURL(data); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
} };
const getDL = () => dlPromise || (dlPromise = (window.claude && claude.use) ? claude.use('downloads').catch(() => webDL) : Promise.resolve(webDL));
const pause = ms => new Promise(r => setTimeout(r, ms));
let exportBlobs = [];
async function doExport() {
  if (!state.layers.length) { toast('Füge zuerst ein Foto hinzu.'); return; }
  ui.sel = null; renderUI();
  const sheet = $('#exportSheet'), grid = $('#expGrid'), prog = $('#expProgress'), note = $('#expNote');
  exportBlobs.forEach(b => URL.revokeObjectURL(b.url)); exportBlobs = [];
  sheet.hidden = false; grid.innerHTML = ''; note.textContent = ''; $('#saveAll').hidden = true;
  const { W, H } = dims(), procs = new Map(), imgs = state.layers.filter(l => l.type === 'image');
  try {
    for (let k = 0; k < imgs.length; k++) {
      const l = imgs[k]; prog.textContent = `Foto ${k + 1} von ${imgs.length} wird in voller Auflösung entwickelt …`; await pause(30);
      const src = sources.get(l.srcId); if (!src) continue;
      const odd = l.rot90 % 2, onw = odd ? src.nh : src.nw, onh = odd ? src.nw : src.nh;
      const [, , swp] = cropRect(onw, onh, l), need = Math.max(onw, onh) * Math.min(1, l.w / swp) * 1.05;
      const base = await loadScaled(src, Math.min(4320, Math.ceil(need))); const o = orientCanvas(base, l.rot90, l.flip);
      procs.set(l.id, processImage(makeAux(o), l.params, l.stampDate));
    }
    for (let i = 0; i < state.slides; i++) {
      prog.textContent = `Slide ${i + 1} von ${state.slides} wird gerendert …`; await pause(20);
      const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); x.translate(-i * W, 0); drawScene(x, { procs });
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .93)); const url = URL.createObjectURL(blob);
      const name = `streifzug-${String(i + 1).padStart(2, '0')}.jpg`; exportBlobs.push({ blob, url, name });
      grid.insertAdjacentHTML('beforeend', `<div class="exp-item"><img src="${url}" alt="Slide ${i + 1}"><div class="row"><span class="num">${i + 1} / ${state.slides} · ${W}×${H}</span><button class="btn ghost small" data-save="${i}" hidden>Sichern</button></div></div>`);
    }
  } catch (err) { prog.textContent = 'Der Export ist fehlgeschlagen. Vermutlich war ein Foto zu groß für den Speicher – versuche es mit weniger Fotos auf einmal.'; return; }
  prog.textContent = `${state.slides} ${state.slides === 1 ? 'Slide' : 'Slides'} fertig · JPEG, ${W}×${H} px`;
  const dl = await getDL();
  if (dl) { $('#saveAll').hidden = state.slides < 2; grid.querySelectorAll('[data-save]').forEach(b => b.hidden = false);
    note.innerHTML = dl === webDL && !matchMedia('(pointer:coarse)').matches ? '<b>So geht’s weiter:</b> „Sichern“ lädt die Slide als JPEG herunter. In Instagram dann alle Slides in der Reihenfolge 1, 2, 3 … auswählen.' : '<b>So geht’s weiter:</b> Tippe auf „Sichern“ und wähle im Teilen-Menü „Bild sichern“. In Instagram dann alle Slides in der Reihenfolge 1, 2, 3 … auswählen.'; }
  else note.innerHTML = '<b>So sicherst du die Slides:</b> Bild gedrückt halten und „Zu Fotos hinzufügen“ wählen. In Instagram dann alle Slides in der Reihenfolge 1, 2, 3 … auswählen.';
}
async function saveOne(i) {
  const dl = await getDL(); const b = exportBlobs[i]; if (!dl || !b) return false;
  try { await dl.save({ filename: b.name, data: b.blob }); return true; }
  catch (e) { if (e && e.code === 'declined') toast('Nicht gesichert.'); else if (e && e.code === 'rate_limited') toast('Einen Moment, dann nochmal versuchen.'); else toast('Sichern ist hier nicht möglich – Bild gedrückt halten.'); return false; }
}
$('#expGrid').addEventListener('click', async e => { const b = e.target.closest('[data-save]'); if (!b) return; if (await saveOne(+b.dataset.save)) { b.textContent = 'Gesichert'; b.disabled = true; } });
$('#saveAll').addEventListener('click', async () => {
  for (let i = 0; i < exportBlobs.length; i++) { const btn = $(`[data-save="${i}"]`); if (btn && btn.disabled) continue; const ok = await saveOne(i); if (!ok) break; if (btn) { btn.textContent = 'Gesichert'; btn.disabled = true; } await pause(250); }
});
$('#closeExport').addEventListener('click', () => $('#exportSheet').hidden = true);
$('#closePreview').addEventListener('click', () => $('#previewSheet').hidden = true);
$('#previewBtn').addEventListener('click', openPreview);
$('#exportBtn').addEventListener('click', doExport);
$('#undoBtn').addEventListener('click', undo);
$('#redoBtn').addEventListener('click', redo);
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selLayer()) { e.preventDefault(); action('del', selLayer()); }
  else if (e.key === 'Escape') { if (!$('#exportSheet').hidden) $('#exportSheet').hidden = true; else if (!$('#previewSheet').hidden) $('#previewSheet').hidden = true; else { ui.sel = null; renderUI(); } }
});
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });

let toastT; function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

/* ---------- Start mit Beispielprojekt ---------- */
function initSample() {
  const id = 's0'; sources.set(id, { kind: 'gen', draw: drawSample, nw: 4800, nh: 2000, date: Date.now(), base: drawSample(1400) });
  const { W, H } = dims();
  const pano = newImageLayer(id, 0, 0, 100); coverAll(pano); pano.x = W * state.slides / 2 + W * .2;
  pano.params.look = 'gold'; pano.params.lookAmt = 70;
  const txt = newTextLayer(W * .5, H * .16, 'Krummhörn, Oktober'); txt.size = 120;
  state.layers = [pano, txt];

initSample();
new ResizeObserver(resize).observe(stage);
resize(); pushHistory(); renderUI();
if (document.fonts) {
  Promise.all(FONTS.map(f => document.fonts.load(`${f[2]} 40px "${f[0]}"`)).concat(document.fonts.load('40px "VT323"'))).catch(() => {}).then(() => { fontsTick++; requestRender(); });
}
})();
