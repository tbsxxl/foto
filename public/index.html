<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Streifzug</title>
<meta name="description" content="Nahtlose Instagram-Karussells mit Looks, Lightroom-Reglern und Retro-Effekten – direkt im Browser.">
<meta name="theme-color" content="#121418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streifzug">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Playfair+Display:ital,wght@0,600;1,600&family=DM+Serif+Display&family=Caveat:wght@600&family=Great+Vibes&family=Special+Elite&family=Permanent+Marker&family=Pacifico&family=Bebas+Neue&family=Anton&family=Archivo+Black&family=Space+Mono:wght@400;700&family=VT323&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="mark">Streif<i>zug</i></span><span class="tag" id="fmtTag">4:5 · 3 Slides</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="projBtn" aria-label="Projekte" title="Projekte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
      <button class="icon-btn" id="undoBtn" aria-label="Rückgängig" title="Rückgängig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="icon-btn" id="redoBtn" aria-label="Wiederholen" title="Wiederholen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button class="btn ghost" id="previewBtn" aria-label="Vorschau"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z" fill="currentColor"/></svg><span class="lbl-long">Vorschau</span></button>
      <button class="btn primary" id="exportBtn">Exportieren</button>
    </div>
  </header>
  <main class="workspace">
    <div class="stage" id="stage"><canvas id="cv" aria-label="Leinwand mit allen Slides"></canvas><div class="stage-hint" id="stageHint"></div></div>
    <section class="dock" aria-label="Werkzeuge">
      <div class="panel-head" id="panelHead"></div>
      <div class="panel" id="panel"></div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </section>
  </main>
</div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>

<div class="sheet" id="previewSheet" hidden>
  <div class="sheet-head"><h2>Vorschau</h2><button class="btn ghost small" id="closePreview">Schließen</button></div>
  <div class="sheet-body">
    <div class="ig">
      <div class="ig-head"><span class="ig-ava"></span><span>dein_profil</span></div>
      <div class="ig-frame"><div class="ig-track" id="igTrack"></div><span class="ig-count" id="igCount">1/3</span></div>
      <div class="ig-dots" id="igDots"></div>
    </div>
    <p class="note" style="max-width:440px;text-align:center">Wische durch die Slides wie später in Instagram. Die Übergänge sollten nahtlos sein.</p>
  </div>
</div>

<div class="sheet" id="exportSheet" hidden>
  <div class="sheet-head"><h2>Export</h2><div class="row"><button class="btn primary small" id="saveAll" hidden>Alle sichern</button><button class="btn ghost small" id="closeExport">Schließen</button></div></div>
  <div class="sheet-body">
    <div class="chips" id="expOpts"></div>
    <p class="progress" id="expProgress">Wird vorbereitet …</p>
    <div class="exp-grid" id="expGrid"></div>
    <p class="note exp-note" id="expNote"></p>
  </div>
</div>

<div class="sheet" id="projSheet" hidden>
  <div class="sheet-head"><h2>Projekte</h2><div class="row"><button class="btn primary small" id="projNew">Neues Projekt</button><button class="btn ghost small" id="closeProj">Schließen</button></div></div>
  <div class="sheet-body">
    <div class="proj-grid" id="projGrid"></div>
    <p class="note exp-note">Projekte werden automatisch gespeichert – nur auf diesem Gerät, in diesem Browser. Fotos werden nirgendwohin hochgeladen.</p>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
